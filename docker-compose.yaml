services:
  # --- VPN (Le tunnel sécurisé) ---
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER:?set OPENVPN_USER in .env}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:?set OPENVPN_PASSWORD in .env}
      - TZ=Europe/Paris
      - OPENVPN_CUSTOM_CONFIG=/gluetun/client.conf
      - DNS_ADDRESS=1.1.1.1 # DNS classiques
      - DOT=off # Désactive DNS-over-TLS (indispensable ici)
      - DNS_KEEP_NAMESERVER=on # Empêche Gluetun d'écraser le DNS
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ./docker-config/vpn:/gluetun
    ports:
      - 9091:9091 # Transmission Web UI
      - 8989:8989 # Sonarr
      - 7878:7878 # Radarr
      - 9696:9696 # Prowlarr
      - 6767:6767 # Bazarr
    restart: always

  # --- DOWNLOADER (Derrière le VPN) ---
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: "container:vpn"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./docker-config/transmission:/config
      - ./data:/data
    depends_on:
      - vpn
    restart: always

  # --- INDEXEURS ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    network_mode: "container:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ./docker-config/prowlarr:/config
    depends_on:
      - vpn
    restart: always

  # --- GESTIONNAIRES ---
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "container:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ./docker-config/radarr:/config
      - ./data:/data
      - /media/raid/storage/Film:/data/media/old-movies # Ajoute ce lien
    depends_on:
      - vpn
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "container:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ./docker-config/sonarr:/config
      - ./data:/data
      - /media/raid/storage/TVshows:/data/media/old-seriesa
    depends_on:
      - vpn
    restart: always

  jellyfin:
    image: jellyfin/jellyfin:latest
    #ports:
    #- 8097:8096
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - "107" # render group on host, needed for /dev/dri/renderD128 (VAAPI/QSV)
    devices:
      - /dev/dri:/dev/dri
    network_mode: "host"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ./docker-config/jellyfin/config:/config
      - ./docker-config/jellyfin/cache:/cache
      - type: bind
        source: ../
        target: /media
    restart: "unless-stopped"
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- STATISTIQUES  ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=jellystat
    volumes:
      - ./docker-config/postgres:/var/lib/postgresql/data
    restart: always

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    ports:
      - 3001:3000
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_IP=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=jellystat
      - TZ=Europe/Paris
      - JWT_SECRET=${JELLYSTAT_JWT_SECRET:?set JELLYSTAT_JWT_SECRET in .env}
      # Served under hub.<domain>/jellystat; on the LAN: http://<server-ip>:3001/jellystat/
      - JS_BASE_URL=/jellystat
    depends_on:
      - postgres
    restart: always
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Paris
      - PORT=5055 #optional
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - 5055:5055
    volumes:
      - ./docker-config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  # --- HUB ---
  hub:
    build: ./hub
    container_name: synarr-hub
    restart: always

  # --- PROXY ---
  caddy:
    build: ./caddy
    container_name: proxy
    # hub.tristanschwenk.fr points at the server's Tailscale IP (DNS-only record), so only
    # tailnet devices reach this port. The router does not forward it.
    ports:
      - "443:443"
      - "443:443/udp"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/routes.caddy:/etc/caddy/routes.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hub
    restart: always

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "container:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ./docker-config/bazarr:/config
      - ./data/media:/data/media # Accès à tes films pour écrire les .srt
      - /media/raid/storage/Film:/data/media/old-movies
      - /media/raid/storage/TVshows:/data/media/old-seriesa
    depends_on:
      - vpn
    restart: always

  # --- TUNNEL (only way in from the internet, no router port) ---
  cloudflared:
    image: cloudflare/cloudflared:2026.10.6
    container_name: synarr-cloudflared
    command: tunnel --no-autoupdate run
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    # Jellyfin runs on the host network: reach it through the host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - seerr
    restart: always

volumes:
  caddy_data:
  caddy_config:

